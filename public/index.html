<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantina Bar Drill</title>
<meta name="theme-color" content="#1A1714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Condensed:ital,wght@0,500;0,700;1,600;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7EEDD; --paper:#FFF9EE; --ink:#1A1714; --muted:#6B6158;
  --orange:#F2A23A; --orange-d:#D9861C; --pink:#D9366B; --green:#2E7A4E; --red:#C23B2E;
  --line:#1A1714; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:"Bowlby One",sans-serif;font-weight:400;font-size:30px;line-height:.95;margin:0;letter-spacing:.5px;color:var(--ink);text-shadow:2px 2px 0 var(--orange)}
.sub{font-family:"Barlow Condensed";font-style:italic;font-weight:600;color:var(--muted);font-size:15px;margin-top:4px}
.streak{font-family:"Barlow Condensed";font-weight:700;font-size:14px;text-align:right;line-height:1.1;white-space:nowrap}
.streak b{display:block;font-family:"Bowlby One";font-weight:400;font-size:22px;color:var(--pink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-family:"Barlow Condensed";font-weight:700;font-size:15px;letter-spacing:.3px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--line);padding:16px;margin:12px 0}
.cat-h{font-family:"Barlow Condensed";font-style:italic;font-weight:700;font-size:22px;margin:22px 0 4px;display:flex;align-items:center;gap:8px}
.cat-h::after{content:"";flex:1;height:2px;background:var(--line)}
.dname{font-family:"Bowlby One";font-weight:400;font-size:20px;line-height:1.1;margin:0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.price{font-family:"Barlow Condensed";font-weight:700;font-size:18px;white-space:nowrap}
.spirit{font-family:"Barlow Condensed";font-style:italic;font-weight:600;color:var(--pink);font-size:16px;margin-top:2px}
.ings{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.ing{background:#F3E2C4;border-radius:6px;padding:3px 8px;font-size:14px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.spec{margin-top:10px;border-top:2px dashed #CDBFA8;padding-top:8px;font-size:14px;white-space:pre-wrap}
.spec.empty{color:var(--muted);font-style:italic}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:#D9CBB3;display:block}
.dots i.f{background:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:12px;background:var(--orange);padding:12px 16px;font-family:"Barlow Condensed";font-weight:700;font-size:18px;letter-spacing:.3px;cursor:pointer;box-shadow:3px 3px 0 var(--line);transition:transform .06s, box-shadow .06s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--paper)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 11px;font-size:15px;border-radius:9px;box-shadow:2px 2px 0 var(--line)}
.btn.block{width:100%}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}
nav .in{display:flex;gap:4px;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;color:#B9AE9F;font-family:"Barlow Condensed";font-weight:700;font-size:15px;padding:6px 0;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink);background:var(--orange)}
.q-meta{display:flex;justify-content:space-between;font-family:"Barlow Condensed";font-weight:700;color:var(--muted);font-size:15px}
.bar{height:8px;border:2px solid var(--line);border-radius:99px;background:var(--paper);overflow:hidden;margin:6px 0 4px}
.bar>div{height:100%;background:var(--pink);transition:width .25s}
.q{font-family:"Bowlby One";font-weight:400;font-size:21px;line-height:1.2;margin:4px 0 0}
.q small{display:block;font-family:Barlow;font-size:15px;color:var(--muted);margin-top:6px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;font-size:16px;line-height:1.3;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.opt.ok{background:#CFEBD8;border-color:var(--green)}
.opt.bad{background:#F6D0CB;border-color:var(--red)}
.opt[disabled]{cursor:default}
.verdict{font-family:"Barlow Condensed";font-weight:700;font-size:20px;margin-top:14px}
.verdict.ok{color:var(--green)} .verdict.bad{color:var(--red)}
.flip{min-height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flip .big{font-family:"Bowlby One";font-size:28px;line-height:1.1}
.hint{font-family:"Barlow Condensed";font-style:italic;font-weight:600;color:var(--muted);font-size:16px;margin-top:10px}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.seg button{flex:1;border:0;background:var(--paper);padding:8px;font-family:"Barlow Condensed";font-weight:700;font-size:15px;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}
.big-score{font-family:"Bowlby One";font-size:56px;line-height:1;text-align:center;margin:8px 0}
label.f{display:block;font-family:"Barlow Condensed";font-weight:700;font-size:15px;margin-top:12px}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-family:Barlow;font-weight:400;font-size:16px}
.f textarea{min-height:90px;resize:vertical}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed #D8C9AF}
.list-item:last-child{border-bottom:0}
.muted{color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(26,23,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.modal .card{width:100%;max-width:540px;max-height:88vh;overflow:auto;margin-bottom:calc(8px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-family:"Barlow Condensed";font-weight:700;z-index:30}
.seg.folders{margin:0 0 10px;box-shadow:3px 3px 0 var(--line)}
.seg.folders button{font-size:17px;padding:10px 6px}
.seg.folders button.on{background:var(--orange);color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:10px;font-size:14px}
.facts dt{font-family:"Barlow Condensed";font-weight:700;color:var(--muted)}
.facts dd{margin:0}
.vid{display:inline-block;margin-top:10px;font-family:"Barlow Condensed";font-weight:700;font-size:15px;color:var(--pink);text-decoration:none;border-bottom:2px solid var(--pink)}
body.locked .wrap,body.locked nav{display:none}
#gate{max-width:440px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
body:not(.locked) #gate{display:none}
.gate-h{font-family:"Bowlby One";font-size:38px;line-height:.95;text-shadow:3px 3px 0 var(--orange);margin:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:"Barlow Condensed";font-weight:700;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:2px;background:#D8C9AF}
.linkbtn{background:none;border:0;padding:0;font-family:"Barlow Condensed";font-weight:700;font-size:16px;color:var(--pink);text-decoration:underline;cursor:pointer}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15px;border:2px solid var(--line)}
.msg.err{background:#F6D0CB}.msg.ok{background:#CFEBD8}.msg.info{background:#FBE7C5}
.sync{font-family:"Barlow Condensed";font-weight:700;font-size:14px;color:var(--muted)}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--green)}
.sync.saving i{background:var(--orange)}.sync.off i{background:var(--red)}
.spinner{width:34px;height:34px;border:4px solid #D8C9AF;border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-block;font-family:"Barlow Condensed";font-weight:700;font-size:13px;border:1.5px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;background:#fff}
</style>
</head>

  <div class="seg folders" id="folders"></div>
  <div class="chips" id="chips"></div>
  <main id="view"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="layer"></div>

/* ---------- Storage (per-browser, safe) ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const DEFAULT_ITEMS=()=>JSON.parse(JSON.stringify(MENU.concat(CLASSICS)));
let items=[], stats={}, decksBy={}, tab="learn";
function initState(remote){
  if(remote&&Array.isArray(remote.items)){
    items=remote.items; stats=remote.stats||{}; decksBy=remote.decksBy||{};
    folder=remote.folder; tab=remote.tab||"learn";
  }else{
    // First sign-in: bring over anything saved in this browser by the old version
    items=load("cbd_items",null)||DEFAULT_ITEMS(); stats=load("cbd_stats",{});
    decksBy=load("cbd_decks2",null)||{cantina:load("cbd_decks",["Cocktails","Happy hour","Shots"])};
    folder=load("cbd_folder","cantina"); tab=load("cbd_tab","learn");
  }
  items.forEach(i=>{if(!i.folder)i.folder="cantina"});
  if(!items.some(i=>i.folder==="classics")&&!(remote&&remote.classicsAdded)) items=items.concat(JSON.parse(JSON.stringify(CLASSICS)));
  if(!FOLDERS[folder]) folder="cantina";
  for(const k in FOLDERS) if(!Array.isArray(decksBy[k])||!decksBy[k].length) decksBy[k]=k==="cantina"?["Cocktails","Happy hour","Shots"]:[...FOLDERS[k].cats];
  if(!["learn","cards","quiz","edit"].includes(tab)) tab="learn";
}
Object.defineProperty(window,"decks",{get:()=>decksBy[folder],set:v=>{decksBy[folder]=v}});
const snapshot=()=>({items,stats,decksBy,folder,tab,classicsAdded:true});
const persist=()=>{if(window.cloudSave) window.cloudSave(snapshot())};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const pool=()=>items.filter(i=>i.folder===folder&&decks.includes(i.cat));
const st=id=>stats[id]||(stats[id]={hit:0,miss:0,streak:0});
function weight(i){const s=st(i.id);let w=1+s.miss*1.6-s.hit*.5-s.streak*.4;if(!s.hit&&!s.miss)w+=1;return Math.max(.25,Math.min(6,w))}
function pickWeighted(arr,avoid){const c=arr.length>1?arr.filter(x=>x.id!==avoid):arr;let t=c.reduce((a,x)=>a+weight(x),0),r=Math.random()*t;for(const x of c){r-=weight(x);if(r<=0)return x}return c[c.length-1]}
function level(i){const s=st(i.id);return Math.max(0,Math.min(3,s.streak))}
function dots(i){const l=level(i);return `<span class="dots" title="Mastery">${[0,1,2].map(n=>`<i class="${n<l?'f':''}"></i>`).join("")}</span>`}
function record(id,ok){const s=st(id);if(ok){s.hit++;s.streak++}else{s.miss++;s.streak=0}persist();renderMastery()}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function renderMastery(){const p=pool().filter(i=>i.ingredients.length||i.qa);const m=p.filter(i=>level(i)>=3).length;$("#mastery").innerHTML=`<b>${m}/${p.length}</b>mastered`}

/* ---------- Chips ---------- */
function renderFolders(){
  $("#folders").innerHTML=Object.entries(FOLDERS).map(([k,f])=>`<button data-f="${k}" class="${folder===k?'on':''}">${esc(f.name)}</button>`).join("");
  $("#folders").querySelectorAll("button").forEach(b=>b.onclick=()=>{folder=b.dataset.f;qz=null;fc.item=null;persist();renderFolders();renderChips();renderMastery();render();window.scrollTo(0,0)});
}
function renderChips(){
  $("#chips").innerHTML=CATS.map(c=>`<button class="chip ${decks.includes(c)?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c; decks=decks.includes(c)?decks.filter(x=>x!==c):[...decks,c];
    if(!decks.length) decks=[c];
    persist();renderChips();renderMastery();render();
  });
}

/* ---------- Card markup ---------- */
function drinkCard(i,opts={}){
  return `<div class="card">
    <div class="row"><h3 class="dname">${esc(i.name)}${opts.dots===false?'':dots(i)}</h3><span class="price">${esc(i.price)}</span></div>
    ${i.spirit?`<div class="spirit">${esc(i.spirit)}</div>`:""}
    ${i.ingredients.length?`<div class="ings">${i.ingredients.map(x=>`<span class="ing">${esc(x)}</span>`).join("")}</div>`:""}
    ${i.note?`<div class="note">${esc(i.note)}</div>`:""}
    ${i.method||i.glass||i.garnish?`<dl class="facts">${i.method?`<dt>Method</dt><dd>${esc(i.method)}</dd>`:""}${i.glass?`<dt>Glass</dt><dd>${esc(i.glass)}</dd>`:""}${i.garnish?`<dt>Garnish</dt><dd>${esc(i.garnish)}</dd>`:""}</dl>`:""}
    ${["Food","Beer","Wine","Softs"].includes(i.cat)||!i.ingredients.length?"":(i.spec?`<div class="spec">${esc(i.spec)}</div>`:`<div class="spec empty">House spec (measures, glass, ice, garnish): not added yet</div>`)}
    ${i.video&&/^https:\/\//.test(i.video)?`<a class="vid" href="${esc(i.video)}" target="_blank" rel="noopener">▶ Watch in the video</a>`:""}
    ${opts.edit?`<div class="btns" style="margin-top:10px"><button class="btn sm ghost" data-edit="${esc(i.id)}">Edit</button></div>`:""}
  </div>`;
}

/* ---------- LEARN ---------- */
function renderLearn(){
  const p=pool();
  let h=`<div class="note" style="margin-top:0">Tap a category above to add or remove it. ${folder==="cantina"?"Specs from the Cantina menu. Add the house measures under <b>Edit</b> once you've seen them on shift.":"Standard classic specs in ml. Bars vary, so follow the house spec when there is one."}</div>`;
  CATS.filter(c=>decks.includes(c)).forEach(c=>{
    const list=p.filter(i=>i.cat===c); if(!list.length) return;
    h+=`<div class="cat-h">${esc(c)}</div>`+list.map(i=>drinkCard(i,{edit:true})).join("");
  });
  $("#view").innerHTML=h||`<div class="empty">Nothing in these categories.</div>`;
  bindEditButtons();
}

/* ---------- FLASHCARDS ---------- */
let fc={item:null,flipped:false,dir:"name"};
function renderCards(){
  const p=pool().filter(i=>i.ingredients.length);
  if(!p.length){$("#view").innerHTML=`<div class="empty">No drinks with ingredients in these categories.</div>`;return}
  if(!fc.item||!p.find(x=>x.id===fc.item.id)) fc.item=pickWeighted(p);
  const i=fc.item;
  const front = fc.dir==="name"
    ? `<div class="big">${esc(i.name)}</div><div class="hint">Say the build out loud: spirit, modifiers, citrus, rim. Then tap.</div>`
    : `<div class="ings" style="justify-content:center">${i.ingredients.map(x=>`<span class="ing">${esc(x)}</span>`).join("")}</div>${i.note?`<div class="note">${esc(i.note.replace(new RegExp(i.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'___'))}</div>`:""}<div class="hint">Which drink is this? Tap to reveal.</div>`;
  $("#view").innerHTML=`
    <div class="seg"><button data-d="name" class="${fc.dir==='name'?'on':''}">Name → build</button><button data-d="ing" class="${fc.dir==='ing'?'on':''}">Build → name</button></div>
    ${fc.flipped?drinkCard(i):`<div class="card flip" id="flip"><div class="q-meta" style="justify-content:center">${esc(i.cat)}</div>${front}</div>`}
    ${fc.flipped?`<div class="btns"><button class="btn red" id="miss">Missed it</button><button class="btn green" id="got">Got it</button></div>`:`<button class="btn block dark" id="reveal" style="margin-top:4px">Reveal</button>`}`;
  document.querySelectorAll("#view .seg button").forEach(b=>b.onclick=()=>{fc.dir=b.dataset.d;fc.flipped=false;renderCards()});
  const flip=()=>{fc.flipped=true;renderCards()};
  if($("#flip")) $("#flip").onclick=flip;
  if($("#reveal")) $("#reveal").onclick=flip;
  if($("#got")) $("#got").onclick=()=>{record(i.id,true);next()};
  if($("#miss")) $("#miss").onclick=()=>{record(i.id,false);next()};
  function next(){fc.item=pickWeighted(p,i.id);fc.flipped=false;renderCards()}
}

/* ---------- QUIZ ---------- */
let qz=null;
const ingStr=i=>i.ingredients.join(", ");
function makeOptions(correct,cands){const w=shuffle(uniq(cands.filter(c=>c&&c!==correct))).slice(0,3);return w.length<2?null:shuffle([correct,...w])}
function genQuestion(i){
  const all=items.filter(x=>x.folder===i.folder&&x.ingredients.length);
  const same=all.filter(x=>x.cat===i.cat&&x.id!==i.id);
  const others=shuffle(same).concat(shuffle(all.filter(x=>x.cat!==i.cat&&x.id!==i.id)));
  const gens=[];
  if(i.ingredients.length>=2) gens.push(()=>{const o=makeOptions(ingStr(i),others.map(ingStr));return o&&{q:`What goes into the <u>${esc(i.name)}</u>?`,opts:o,a:ingStr(i)}});
  if(i.ingredients.length>=2) gens.push(()=>{const o=makeOptions(i.name,others.filter(x=>ingStr(x)!==ingStr(i)).map(x=>x.name));return o&&{q:`Which drink is this?<small>${esc(ingStr(i))}</small>`,opts:o,a:i.name}});
  if(i.price&&i.price.startsWith("£")) gens.push(()=>{const o=makeOptions(i.price,shuffle(uniq(items.filter(x=>x.cat===i.cat||x.cat==="Cocktails").map(x=>x.price))).filter(p=>p&&p.startsWith("£")));return o&&{q:`How much is the <u>${esc(i.name)}</u>?`,opts:o,a:i.price}});
  if(i.spirit) gens.push(()=>{const o=makeOptions(i.spirit,items.filter(x=>x.spirit&&x.spirit!==i.spirit&&!x.spirit.includes(i.spirit)&&!i.spirit.includes(x.spirit)).map(x=>x.spirit));return o&&{q:`What's the base spirit in the <u>${esc(i.name)}</u>?`,opts:o,a:i.spirit}});
  if(i.ingredients.length>=3) gens.push(()=>{
    const mine=i.ingredients.map(s=>s.toLowerCase());
    const foreign=shuffle(uniq(others.flatMap(x=>x.ingredients))).find(s=>!mine.some(m=>m.includes(s.toLowerCase())||s.toLowerCase().includes(m)));
    if(!foreign) return null;
    const opts=shuffle([foreign,...shuffle(i.ingredients).slice(0,3)]);
    return {q:`Which of these is <b>NOT</b> in the <u>${esc(i.name)}</u>?`,opts,a:foreign};
  });
  [["method","How is the <u>%s</u> made?"],["glass","What's the <u>%s</u> served in?"],["garnish","What's the garnish on the <u>%s</u>?"]].forEach(([f,t])=>{
    if(!i[f]) return;
    gens.push(()=>{const o=makeOptions(i[f],all.filter(x=>x[f]&&x[f]!==i[f]).map(x=>x[f]));return o&&{q:t.replace("%s",esc(i.name)),opts:o,a:i[f]}});
  });
  (i.qa||[]).forEach(x=>gens.push(()=>({q:esc(x.q),opts:shuffle([x.a,...x.w.slice(0,3)]),a:x.a})));
  for(const g of shuffle(gens)){const r=g();if(r)return {...r,item:i}}
  return null;
}
function startQuiz(n=10){
  const p=pool().filter(i=>i.ingredients.length||(i.qa&&i.qa.length));
  if(!p.length){qz=null;$("#view").innerHTML=`<div class="empty">Pick a category with drinks first.</div>`;return}
  const qs=[];let last=null,guard=0;
  while(qs.length<n&&guard++<200){const it=pickWeighted(p,last);const q=genQuestion(it);if(q&&!qs.some(x=>x.q===q.q)){qs.push(q);last=it.id}}
  qz={qs,idx:0,score:0,answered:false,picked:null,missed:[]};
  renderQuiz();
}
function renderQuiz(){
  if(!qz){startQuiz();return}
  if(qz.idx>=qz.qs.length){
    const pct=Math.round(qz.score/qz.qs.length*100);
    const missed=uniq(qz.missed);
    $("#view").innerHTML=`<div class="card" style="text-align:center">
      <div class="q-meta" style="justify-content:center">Round done</div>
      <div class="big-score">${qz.score}/${qz.qs.length}</div>
      <div class="hint" style="margin-top:0">${pct===100?"Flawless. Behind the bar you go.":pct>=80?"Solid. A couple to tighten up.":pct>=50?"Getting there. Run another round.":"Back to the Learn tab for a bit, then go again."}</div>
      <button class="btn block" id="again" style="margin-top:16px">Another round</button></div>
      ${missed.length?`<div class="cat-h">Review these</div>`+missed.map(id=>drinkCard(items.find(x=>x.id===id))).join(""):""}`;
    $("#again").onclick=()=>startQuiz();
    return;
  }
  const q=qz.qs[qz.idx];
  $("#view").innerHTML=`<div class="card">
    <div class="q-meta"><span>Question ${qz.idx+1} of ${qz.qs.length}</span><span>${esc(q.item.cat)}</span></div>
    <div class="bar"><div style="width:${qz.idx/qz.qs.length*100}%"></div></div>
    <p class="q">${q.q}</p>
    <div class="opts">${q.opts.map((o,k)=>{
      let cls="";if(qz.answered){if(o===q.a)cls="ok";else if(k===qz.picked)cls="bad"}
      return `<button class="opt ${cls}" data-k="${k}" ${qz.answered?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
    ${qz.answered?`<div class="verdict ${q.opts[qz.picked]===q.a?'ok':'bad'}">${q.opts[qz.picked]===q.a?"¡Eso! Correct.":"Not quite."}</div>`:""}
  </div>
  ${qz.answered?drinkCard(q.item)+`<button class="btn block dark" id="nextq">${qz.idx+1<qz.qs.length?"Next question":"See score"}</button>`:""}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(qz.answered) return;
    qz.picked=+b.dataset.k;qz.answered=true;
    const ok=q.opts[qz.picked]===q.a; if(ok) qz.score++; else qz.missed.push(q.item.id);
    record(q.item.id,ok); renderQuiz();
  });
  if($("#nextq")) $("#nextq").onclick=()=>{qz.idx++;qz.answered=false;qz.picked=null;renderQuiz();window.scrollTo(0,0)};
}

function openEditor(id){
  const it=id?items.find(x=>x.id===id):{id:"",folder,cat:decks[0]||CATS[0],name:"",price:"",spirit:"",ingredients:[],note:"",spec:"",method:"",glass:"",garnish:""};

    persist();closeModal();render();renderMastery();toast("Saved");
  };
  if($("#del")) $("#del").onclick=()=>confirmBox(`Delete ${it.name}?`,()=>{items=items.filter(x=>x.id!==id);persist();render();renderMastery();toast("Deleted")});

<script type="module">

const V = "13.4.0";
const gate = document.getElementById("gate");
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
gate.innerHTML = '<div class="spinner"></div>';

/* ---------- Sign-in screens ---------- */
let mode = "signin", flash = null;

  gate.innerHTML = `<h1 class="gate-h">CANTINA<br>BAR DRILL</h1>

function syncHTML(){
  const t={ok:"Synced",saving:"Saving…",off:"Offline: changes will sync when you reconnect"}[syncState];
  return `<span id="sync" class="sync ${syncState==="saving"?"saving":syncState==="off"?"off":""}"><i></i>${t}</span>`;
}
window.cloudSave = data => {
  if(!user) return;
  pending = data; setSync("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
};
async function flush(){
  if(!user||!pending) return;
  const data = JSON.parse(JSON.stringify(pending)); pending=null;
  try{
    await F.setDoc(userDoc(), {...data, updatedAt:F.serverTimestamp()});
    setSync(navigator.onLine===false?"off":"ok");
  }catch(err){ console.error(err); setSync("off"); }
}
addEventListener("online",()=>setSync("ok"));
addEventListener("offline",()=>setSync("off"));
addEventListener("pagehide",()=>{ if(pending) flush(); });

/* ---------- Account panel (inside the Edit tab) ---------- */
window.renderAccount = el => {
  if(!user||!el) return;
  const isPw = user.providerData.some(p=>p.providerId==="password");
  const isG = user.providerData.some(p=>p.providerId==="google.com");
  el.innerHTML = `<div class="row"><div class="dname" style="font-size:18px">Account</div>${syncHTML()}</div>
    <div style="margin-top:6px"><b>${esc(user.displayName||"")}</b>${user.displayName?"<br>":""}<span class="muted">${esc(user.email||"")}</span>
    ${isG?'<span class="tag">Google</span>':""}</div>
    ${isPw&&!user.emailVerified?`<div class="msg info">Please verify your email so you can always recover your account. <button class="linkbtn" id="ac-ver">Resend link</button></div>`:""}
    <div class="btns">${isPw?`<button class="btn sm ghost" id="ac-pw">Change password</button>`:""}<button class="btn sm dark" id="ac-out">Sign out</button></div>
    <div style="margin-top:12px"><button class="linkbtn" id="ac-del" style="color:var(--red)">Delete my account</button></div>`;
  const m = window; // helpers from the app script
  el.querySelector("#ac-out").onclick = async()=>{ await flush(); await A.signOut(auth); };
  const ver=el.querySelector("#ac-ver"); if(ver) ver.onclick=async()=>{try{await A.sendEmailVerification(user);m.toast("Verification email sent")}catch(e){m.toast(errText(e))}};
  const pw=el.querySelector("#ac-pw"); if(pw) pw.onclick=async()=>{try{await A.sendPasswordResetEmail(auth,user.email);m.toast("Password link sent to your email")}catch(e){m.toast(errText(e))}};
  el.querySelector("#ac-del").onclick = ()=>deleteFlow(isPw);
};
function deleteFlow(isPw){
  const m=window;
  m.modal(`<div class="dname" style="font-size:18px">Delete your account?</div>
    <div class="note">This permanently removes your account, your progress and any drinks you've edited. It can't be undone.</div>
    ${isPw?`<label class="f">Confirm with your password<input id="d-pass" type="password" autocomplete="current-password"></label>`:`<div class="note">You'll be asked to confirm with Google.</div>`}
    <div id="d-msg"></div>
    <div class="btns"><button class="btn ghost" id="d-no">Cancel</button><button class="btn red" id="d-yes">Delete forever</button></div>`);
  document.getElementById("d-no").onclick=m.closeModal;
  document.getElementById("d-yes").onclick=async()=>{
    const msg=document.getElementById("d-msg");
    try{
      if(isPw) await A.reauthenticateWithCredential(user, A.EmailAuthProvider.credential(user.email, document.getElementById("d-pass").value));
      else await A.reauthenticateWithPopup(user, new A.GoogleAuthProvider());
      clearTimeout(saveTimer); pending=null;
      await F.deleteDoc(userDoc());
      await A.deleteUser(user);
      m.closeModal();
    }catch(e){ msg.innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; }
  };
}

/* ---------- Auth state ---------- */
A.onAuthStateChanged(auth, async u => {
  user = u;
  if(!u){
    document.body.classList.add("locked"); mode="signin"; gateView(); return;
  }
  gate.innerHTML='<div class="spinner"></div>';
  let remote=null;
  try{ const snap=await F.getDoc(userDoc()); if(snap.exists()) remote=snap.data(); }
  catch(err){
    console.error(err);
    // Never start with blank data offline: it could overwrite your saved progress
    gate.innerHTML=`<h1 class="gate-h">CANTINA<br>BAR DRILL</h1><div class="card"><div class="dname" style="font-size:18px">Can't load your progress</div>
      <div class="note">You seem to be offline. Connect once on this device and your data will be available offline after that.</div>
      <div class="btns"><button class="btn sm ghost" id="g-out">Sign out</button><button class="btn sm dark" id="g-retry">Try again</button></div></div>`;
    document.getElementById("g-retry").onclick=()=>location.reload();
    document.getElementById("g-out").onclick=()=>A.signOut(auth);
    return;
  }
  document.body.classList.remove("locked");
  window.bootApp(remote);
});
</script>
