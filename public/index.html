<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantina Bar Drill</title>
<meta name="theme-color" content="#F7EEDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13100E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. TOKENS
   Every colour, size, space and radius used below comes from here.
   ========================================================= */
:root{
  /* colour: light (default) */
  --c-bg:#F7EEDD; --c-surface:#FFFAF0; --c-sunken:#F1DFBF;
  --c-ink:#1A1714; --c-muted:#5C534A; --c-line:#1A1714; --c-line-soft:#D9C9AE; --c-meter-off:#8C7F6E;
  --c-shadow:#1A1714;
  --c-brand:#F2A23A; --c-on-brand:#1A1714;
  --c-accent:#A8204F;
  --c-success:#24683F; --c-success-bg:#D3EBDA; --c-on-success:#FFFFFF;
  --c-danger:#A93226;  --c-danger-bg:#F6D5D0;  --c-on-danger:#FFFFFF;
  --c-info-bg:#FBE5BF;
  --c-nav-bg:#1A1714; --c-nav-fg:#C9BFB2;
  --c-focus:#1A1714; --c-focus-halo:#F2A23A;

  /* type */
  --f-display:"Bowlby One", "Arial Black", Impact, sans-serif;
  --f-label:"Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body:Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-sm:.875rem;   /* 14 – meta, tags */
  --fs-md:1rem;      /* 16 – body */
  --fs-lg:1.125rem;  /* 18 – labels, buttons */
  --fs-xl:1.375rem;  /* 22 – card titles, questions */
  --fs-2xl:1.75rem;  /* 28 – wordmark, flashcard */
  --fs-3xl:3rem;     /* 48 – score */
  --lh-tight:1.15; --lh-body:1.45;

  /* space (4-pt) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;

  /* shape */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --bw:2px;
  --sh-sm:2px 2px 0 var(--c-shadow); --sh-md:4px 4px 0 var(--c-shadow);

  /* motion */
  --dur:120ms; --ease:cubic-bezier(.2,.7,.3,1);

  /* layout */
  --tap:44px; --maxw:560px; --nav-h:64px;
}
/* colour: dark – automatic, unless the user picked light */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#13100E; --c-surface:#211C18; --c-sunken:#30281F;
    --c-ink:#F7EEDD; --c-muted:#C2B6A6; --c-line:#9C8E7C; --c-line-soft:#3E352D; --c-meter-off:#7A6E60;
    --c-shadow:#000;
    --c-accent:#F27BA2;
    --c-success:#6FCF97; --c-success-bg:#1E3A2A; --c-on-success:#13100E;
    --c-danger:#F28B7D;  --c-danger-bg:#46231F;  --c-on-danger:#13100E;
    --c-info-bg:#3D2F17;
    --c-nav-bg:#0B0908; --c-nav-fg:#B9AE9F;
    --c-focus:#F7EEDD; --c-focus-halo:#F2A23A;
  }
}
/* colour: dark – chosen manually */
:root[data-theme="dark"]{
  --c-bg:#13100E; --c-surface:#211C18; --c-sunken:#30281F;
  --c-ink:#F7EEDD; --c-muted:#C2B6A6; --c-line:#9C8E7C; --c-line-soft:#3E352D; --c-meter-off:#7A6E60;
  --c-shadow:#000;
  --c-accent:#F27BA2;
  --c-success:#6FCF97; --c-success-bg:#1E3A2A; --c-on-success:#13100E;
  --c-danger:#F28B7D;  --c-danger-bg:#46231F;  --c-on-danger:#13100E;
  --c-info-bg:#3D2F17;
  --c-nav-bg:#0B0908; --c-nav-fg:#B9AE9F;
  --c-focus:#F7EEDD; --c-focus-halo:#F2A23A;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--c-bg)}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font:var(--fs-md)/var(--lh-body) var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:3px;box-shadow:0 0 0 6px var(--c-focus-halo);border-radius:var(--r-sm)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--s-4);top:-100px;z-index:50;background:var(--c-brand);color:var(--c-on-brand);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);font:700 var(--fs-lg) var(--f-label)}
.skip:focus{top:var(--s-4)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* =========================================================
   3. LAYOUT
   ========================================================= */
.wrap{max-width:var(--maxw);margin:0 auto;padding:calc(var(--s-4) + env(safe-area-inset-top)) var(--s-4) calc(var(--nav-h) + var(--s-7) + env(safe-area-inset-bottom))}
body.locked .app,body.locked .tabbar{display:none}
body:not(.locked) #gate{display:none}
.stack>*+*{margin-top:var(--s-3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)}
.cluster{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.grow{flex:1}

/* =========================================================
   4. COMPONENTS
   ========================================================= */
/* --- Top bar --- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-4);margin-bottom:var(--s-4)}
.wordmark{font:400 var(--fs-2xl)/1 var(--f-display);letter-spacing:.02em;text-shadow:2px 2px 0 var(--c-brand)}
.eyebrow{display:block;font:italic 600 var(--fs-md)/1.2 var(--f-label);color:var(--c-muted);margin-top:var(--s-1)}
.meter-wrap{min-width:120px;text-align:right}
.meter-label{font:700 var(--fs-sm)/1.2 var(--f-label);color:var(--c-muted)}
.meter-label b{font:400 var(--fs-xl)/1 var(--f-display);color:var(--c-ink)}
.bar{height:10px;border:var(--bw) solid var(--c-line);border-radius:var(--r-pill);background:var(--c-surface);overflow:hidden;margin-top:var(--s-1)}
.bar>span{display:block;height:100%;background:var(--c-success);transition:width .3s var(--ease)}
.bar.quiz>span{background:var(--c-brand)}

/* --- Segmented control (toggle group) --- */
.seg{display:flex;border:var(--bw) solid var(--c-line);border-radius:var(--r-md);overflow:hidden;background:var(--c-surface)}
.seg button{flex:1;min-height:var(--tap);border:0;background:transparent;font:700 var(--fs-lg)/1.1 var(--f-label);padding:var(--s-2) var(--s-3);transition:background var(--dur) var(--ease)}
.seg button+button{border-left:var(--bw) solid var(--c-line)}
.seg button[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
.seg.primary{box-shadow:var(--sh-sm)}
.seg.primary button[aria-pressed="true"]{background:var(--c-brand);color:var(--c-on-brand)}
.seg button:focus-visible{outline-offset:-5px;box-shadow:none;border-radius:var(--r-sm)}

/* --- Filter chips --- */
.chips{display:flex;gap:var(--s-2);overflow-x:auto;scrollbar-width:none;margin:var(--s-3) calc(-1 * var(--s-4)) 0;padding:var(--s-1) var(--s-4) var(--s-2);scroll-padding:var(--s-4);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--s-4),#000 calc(100% - var(--s-6)),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 var(--s-4),#000 calc(100% - var(--s-6)),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:var(--tap);display:inline-flex;align-items:center;gap:var(--s-2);border:var(--bw) solid var(--c-line);background:var(--c-surface);border-radius:var(--r-pill);padding:0 var(--s-4);font:700 var(--fs-md)/1 var(--f-label);letter-spacing:.02em}
.chip .n{font:600 var(--fs-sm)/1 var(--f-body);color:var(--c-muted)}
.chip[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip[aria-pressed="true"]::before{content:"✓";font-size:var(--fs-sm)}

/* --- Card --- */
.card{background:var(--c-surface);border:var(--bw) solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:var(--s-4);margin:var(--s-4) 0}
.card.flat{box-shadow:none}
.card.danger{border-color:var(--c-danger);box-shadow:none}
.card-title{font:400 var(--fs-xl)/var(--lh-tight) var(--f-display);margin:0}
.section-title{display:flex;align-items:center;gap:var(--s-2);font:italic 700 var(--fs-xl)/1 var(--f-label);margin:var(--s-6) 0 0}
.section-title::after{content:"";flex:1;height:var(--bw);background:var(--c-line)}
.section-title .n{font:600 var(--fs-sm)/1 var(--f-body);font-style:normal;color:var(--c-muted)}
.panel-title{font:700 var(--fs-xl)/1.1 var(--f-label);margin:0}
.lede{color:var(--c-muted);font-size:var(--fs-sm);margin-top:var(--s-1)}
.muted{color:var(--c-muted)}

/* --- Drink card content --- */
.drink-head{display:flex;align-items:flex-start;gap:var(--s-3)}
.drink-head .grow{min-width:0}
.drink-head .price,.m-head .price{white-space:normal;text-align:right;max-width:45%}
.price{font:700 var(--fs-lg)/1.2 var(--f-label);white-space:nowrap;padding-top:2px}
.spirit{font:italic 600 var(--fs-md)/1.2 var(--f-label);color:var(--c-accent);margin-top:var(--s-1)}
.ings{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-2);margin:var(--s-3) 0 0;padding:0;list-style:none}
.ings li,.ings>span{background:var(--c-sunken);border-radius:var(--r-sm);padding:var(--s-1) var(--s-2);font-size:var(--fs-sm)}
.note{font-size:var(--fs-sm);color:var(--c-muted);margin-top:var(--s-2)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:var(--s-1) var(--s-3);margin:var(--s-3) 0 0;font-size:var(--fs-sm)}
.facts dt{font:700 var(--fs-sm)/1.45 var(--f-label);color:var(--c-muted);text-transform:uppercase;letter-spacing:.04em}
.facts dd{margin:0}
.spec{margin-top:var(--s-3);padding-top:var(--s-3);border-top:var(--bw) dashed var(--c-line-soft);font-size:var(--fs-sm);white-space:pre-line}
.spec-label{display:block;font:700 var(--fs-sm)/1.45 var(--f-label);color:var(--c-muted);text-transform:uppercase;letter-spacing:.04em}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-4);margin-top:var(--s-3)}

/* --- Bar mode --- */
.ticket{background:var(--c-ink);color:var(--c-bg);border-radius:var(--r-lg);padding:var(--s-4);margin-top:var(--s-4);box-shadow:var(--sh-md)}
.ticket .eyebrow,.ticket .meter-label{color:inherit;opacity:.85}
.ticket .link{color:var(--c-brand)}
.ticket .msg{color:var(--c-ink);margin-top:var(--s-3)}
.ticket-name{font:400 var(--fs-2xl)/1.1 var(--f-display);margin-top:var(--s-2)}
.variant{display:inline-block;font:700 var(--fs-md)/1 var(--f-label);background:var(--c-brand);color:var(--c-on-brand);border-radius:var(--r-pill);padding:6px 12px;vertical-align:middle}
.bar-step{border:0;padding:0;margin:var(--s-5) 0 0;min-width:0}
.step-title{font:italic 700 var(--fs-xl)/1 var(--f-label);padding:0;margin-bottom:var(--s-2)}
.picks{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.pick{min-height:var(--tap);border:var(--bw) solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);padding:var(--s-2) var(--s-3);font:600 var(--fs-sm)/1.25 var(--f-body);text-align:left}
.pick[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
.rail-h{font:700 var(--fs-sm)/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.05em;color:var(--c-muted);margin:var(--s-4) 0 var(--s-2)}
.buildlist{list-style:none;margin:0;padding:var(--s-2) var(--s-3);background:var(--c-surface);border:var(--bw) dashed var(--c-line);border-radius:var(--r-md)}
.bl-row{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-1) 0}
.bl-row+.bl-row{border-top:1px solid var(--c-line-soft)}
.bl-row .grow{font-weight:600;font-size:var(--fs-sm)}
.amt{width:auto;min-width:112px;min-height:var(--tap);padding:var(--s-1) var(--s-2)}
.amt-fixed{font:700 var(--fs-md) var(--f-label);min-width:112px;text-align:center}
.checks{list-style:none;margin:var(--s-3) 0 0;padding:0}
.checks li{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-2) 0;border-top:1px solid var(--c-line-soft)}
.checks .ck{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.checks .ck svg{width:16px;height:16px}
.checks li.ok .ck{background:var(--c-success);color:var(--c-on-success)}
.checks li.bad .ck{background:var(--c-danger);color:var(--c-on-danger)}
.ck-detail{display:block;font-size:var(--fs-sm);color:var(--c-muted)}
.checks li.bad .ck-detail{color:var(--c-ink)}
.verdict.panel-title svg{width:24px;height:24px}
/* --- Families --- */
body.fam-mode .chips{display:none}
.template{background:var(--c-sunken);border-radius:var(--r-lg);padding:var(--s-4);margin-top:var(--s-3)}
.tpl-build{font:700 var(--fs-lg)/1.3 var(--f-label);margin-top:var(--s-1)}
.rules{margin:var(--s-1) 0 0;padding-left:1.1em;font-size:var(--fs-sm)}
.rules li+li{margin-top:var(--s-1)}
.member{border:var(--bw) solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);margin-top:var(--s-2)}
.member summary{list-style:none;cursor:pointer;min-height:var(--tap);padding:var(--s-3) var(--s-4) var(--s-3) 40px;position:relative;border-radius:var(--r-md)}
.member summary::-webkit-details-marker{display:none}
.member summary::before{content:"";position:absolute;left:var(--s-4);top:22px;width:8px;height:8px;border-right:2.5px solid var(--c-ink);border-bottom:2.5px solid var(--c-ink);transform:rotate(-45deg);transition:transform var(--dur) var(--ease)}
.member[open] summary::before{transform:rotate(45deg);top:19px}
.m-head{display:flex;justify-content:space-between;gap:var(--s-3);align-items:baseline}
.m-name{font:400 var(--fs-lg)/1.2 var(--f-display)}
.m-diff{display:block;font-size:var(--fs-sm);margin-top:var(--s-1);color:var(--c-ink)}
.member .card{margin:0 var(--s-2) var(--s-2);box-shadow:none}
/* --- Mastery meter (3 segments + text for AT) --- */
.mastery{display:inline-flex;gap:3px;vertical-align:middle}
.mastery i{width:10px;height:10px;border-radius:50%;border:2px solid var(--c-meter-off);display:block}
.mastery i.on{background:var(--c-success);border-color:var(--c-success)}

/* --- Buttons --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:48px;border:var(--bw) solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);color:var(--c-ink);padding:var(--s-2) var(--s-4);font:700 var(--fs-lg)/1.1 var(--f-label);letter-spacing:.02em;box-shadow:var(--sh-sm);text-decoration:none;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--c-shadow)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
.btn-primary{background:var(--c-brand);color:var(--c-on-brand);border-color:var(--c-line)}
.btn-dark{background:var(--c-ink);color:var(--c-bg)}
.btn-success{background:var(--c-success);color:var(--c-on-success)}
.btn-danger{background:var(--c-danger);color:var(--c-on-danger)}
.btn-danger-outline{color:var(--c-danger);border-color:var(--c-danger);box-shadow:none}
.btn-sm{min-height:var(--tap);font-size:var(--fs-md);padding:var(--s-1) var(--s-3);border-radius:var(--r-sm)}
.btn-block{width:100%}
.btn-icon{min-width:var(--tap);min-height:var(--tap);padding:0;border-radius:var(--r-sm);box-shadow:none;border-color:transparent;background:transparent}
.btn-icon:hover{border-color:var(--c-line)}
.btn svg{width:20px;height:20px;flex:none}
.btns{display:flex;gap:var(--s-3);margin-top:var(--s-4)}
.btns>.btn{flex:1}
.link{display:inline-flex;align-items:center;min-height:var(--tap);background:none;border:0;padding:0 var(--s-1);font:700 var(--fs-md)/1.2 var(--f-label);color:var(--c-accent);text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--c-danger)}

/* --- Sticky action bar (sits above the tab bar) --- */
.actionbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--s-3));z-index:5;margin-top:var(--s-4)}
.actionbar .btn{box-shadow:var(--sh-md)}

/* --- Search field --- */
.search{position:relative;margin-top:var(--s-4)}
.search svg{position:absolute;left:var(--s-3);top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--c-muted);pointer-events:none}
.search input{width:100%;min-height:48px;border:var(--bw) solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);padding:var(--s-2) var(--s-3) var(--s-2) 40px;font-size:var(--fs-md)}
.search input::placeholder{color:var(--c-muted);opacity:1}

/* --- Form fields --- */
.field{display:block;margin-top:var(--s-4)}
.field-label{display:block;font:700 var(--fs-md)/1.2 var(--f-label);margin-bottom:var(--s-1)}
.field-hint{display:block;font-size:var(--fs-sm);color:var(--c-muted);margin-top:var(--s-1)}
.field-error{display:block;font-size:var(--fs-sm);color:var(--c-danger);font-weight:600;margin-top:var(--s-1)}
.input{display:block;width:100%;min-height:48px;border:var(--bw) solid var(--c-line);border-radius:var(--r-sm);background:var(--c-surface);padding:var(--s-2) var(--s-3);font-size:var(--fs-md)}
textarea.input{min-height:104px;resize:vertical;line-height:var(--lh-body)}
.input[aria-invalid="true"]{border-color:var(--c-danger);box-shadow:0 0 0 2px var(--c-danger)}
.input::placeholder{color:var(--c-muted);opacity:.85}
.pw{position:relative}
.pw .input{padding-right:84px}
.pw button{position:absolute;right:2px;top:2px;bottom:2px;min-width:76px;border:0;border-left:var(--bw) solid var(--c-line-soft);background:transparent;font:700 var(--fs-md) var(--f-label);border-radius:0 var(--r-sm) var(--r-sm) 0}
.split{display:flex;gap:var(--s-3)}.split>*{flex:1;min-width:0}

/* --- Inline messages --- */
.msg{margin-top:var(--s-3);padding:var(--s-3);border-radius:var(--r-md);font-size:var(--fs-sm);border:var(--bw) solid var(--c-line)}
.msg-error{background:var(--c-danger-bg)} .msg-success{background:var(--c-success-bg)} .msg-info{background:var(--c-info-bg)}
.tag{display:inline-block;font:700 var(--fs-sm)/1.3 var(--f-label);border:1.5px solid var(--c-line);border-radius:6px;padding:0 6px;margin-left:var(--s-1);vertical-align:2px;background:var(--c-surface)}
.tag.ok{background:var(--c-success-bg)}

/* --- Quiz --- */
.q-meta{display:flex;justify-content:space-between;font:700 var(--fs-md)/1.2 var(--f-label);color:var(--c-muted)}
.question{font:400 var(--fs-xl)/1.25 var(--f-display);margin-top:var(--s-3)}
.question strong{font-weight:400;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--c-brand) 55%,transparent) 0)}
.question-detail{font:500 var(--fs-md)/var(--lh-body) var(--f-body);margin-top:var(--s-2)}
.options{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-4)}
.option{display:flex;align-items:center;gap:var(--s-3);text-align:left;min-height:56px;border:var(--bw) solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);padding:var(--s-3) var(--s-4);font-size:var(--fs-md);line-height:1.3;box-shadow:var(--sh-sm)}
.option .key{flex:none;width:28px;height:28px;border-radius:50%;border:var(--bw) solid var(--c-line);display:grid;place-items:center;font:700 var(--fs-sm) var(--f-label)}
.option[aria-disabled="true"]{cursor:default;box-shadow:none}
.option.is-correct{background:var(--c-success-bg);border-color:var(--c-success)}
.option.is-correct .key{background:var(--c-success);border-color:var(--c-success);color:var(--c-on-success)}
.option.is-wrong{background:var(--c-danger-bg);border-color:var(--c-danger)}
.option.is-wrong .key{background:var(--c-danger);border-color:var(--c-danger);color:var(--c-on-danger)}
.option.is-dim{opacity:.6}
.option .why{display:block;font:700 var(--fs-sm)/1.2 var(--f-label);margin-top:2px}
.verdict{display:flex;align-items:center;gap:var(--s-2);font:700 var(--fs-xl)/1.1 var(--f-label);margin-top:var(--s-4)}
.verdict svg{width:24px;height:24px;flex:none}
.option .key svg{width:16px;height:16px}
.verdict.ok{color:var(--c-success)} .verdict.bad{color:var(--c-danger)}
.score{font:400 var(--fs-3xl)/1 var(--f-display);text-align:center;margin:var(--s-2) 0}

/* --- Flashcard --- */
.flashcard{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:var(--s-3);width:100%;min-height:260px;text-align:center;border:var(--bw) solid var(--c-line);border-radius:var(--r-lg);background:var(--c-surface);box-shadow:var(--sh-md);padding:var(--s-5);margin:var(--s-4) 0 0}
.flashcard .big{font:400 var(--fs-2xl)/1.1 var(--f-display)}
.flashcard .ings{justify-content:center}
.hint{font:italic 600 var(--fs-md)/1.35 var(--f-label);color:var(--c-muted)}

/* --- Tab bar --- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--c-nav-bg);padding:var(--s-2) var(--s-2) calc(var(--s-2) + env(safe-area-inset-bottom))}
.tabbar ul{display:flex;gap:var(--s-1);max-width:var(--maxw);margin:0 auto;padding:0;list-style:none}
.tabbar li{flex:1}
.tabbar button{width:100%;min-height:48px;background:none;border:0;color:var(--c-nav-fg);font:700 var(--fs-md)/1 var(--f-label);padding:var(--s-1) 0;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--c-on-brand);background:var(--c-brand)}
.tabbar button:focus-visible{outline-color:var(--c-brand);box-shadow:none}

/* --- Dialog --- */
.scrim{position:fixed;inset:0;background:rgba(10,8,7,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:var(--s-3)}
.dialog{width:100%;max-width:540px;max-height:88vh;overflow:auto;margin:0 0 calc(var(--s-2) + env(safe-area-inset-bottom));background:var(--c-surface);border:var(--bw) solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:var(--s-4) var(--s-4) var(--s-5)}
@media (min-width:600px){.scrim{align-items:center}}
body.modal-open{overflow:hidden}

/* --- Toast --- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--s-5) + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--c-ink);color:var(--c-bg);padding:var(--s-2) var(--s-4);border-radius:var(--r-pill);font:700 var(--fs-md) var(--f-label);z-index:30;max-width:calc(100vw - 32px)}

/* --- Gate (sign-in) --- */
#gate{max-width:440px;margin:0 auto;padding:calc(var(--s-6) + env(safe-area-inset-top)) var(--s-4) var(--s-7)}
.gate-h{font:400 2.25rem/.95 var(--f-display);text-shadow:3px 3px 0 var(--c-brand)}
.or{display:flex;align-items:center;gap:var(--s-3);color:var(--c-muted);font:700 var(--fs-md) var(--f-label);margin:var(--s-4) 0}
.or::before,.or::after{content:"";flex:1;height:var(--bw);background:var(--c-line-soft)}
.sync{display:inline-flex;align-items:center;gap:var(--s-2);font:700 var(--fs-sm) var(--f-label);color:var(--c-muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--c-success)}
.sync.saving i{background:var(--c-brand)} .sync.off i{background:var(--c-danger)}
.spinner{width:34px;height:34px;border:4px solid var(--c-line-soft);border-top-color:var(--c-ink);border-radius:50%;animation:sp .8s linear infinite;margin:var(--s-7) auto}
@keyframes sp{to{transform:rotate(360deg)}}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:var(--s-3);padding:var(--s-2) 0;border-bottom:var(--bw) dashed var(--c-line-soft)}
.list-item:last-child{border-bottom:0}
.empty{text-align:center;padding:var(--s-6) var(--s-3);color:var(--c-muted)}
</style>

/* ---------- Storage (per-browser, safe) ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const DEFAULT_ITEMS=()=>JSON.parse(JSON.stringify(MENU.concat(CLASSICS)));
let items=[], stats={}, decksBy={}, tab="learn";
function initState(remote){
  if(remote&&Array.isArray(remote.items)){
    items=remote.items; stats=remote.stats||{}; decksBy=remote.decksBy||{};
    folder=remote.folder; tab=remote.tab||"learn";
  }else{
    // First sign-in: bring over anything saved in this browser by an earlier version
    items=load("cbd_items",null)||DEFAULT_ITEMS(); stats=load("cbd_stats",{});
    decksBy=load("cbd_decks2",null)||{cantina:load("cbd_decks",["Cocktails","Happy hour","Shots"])};
    folder=load("cbd_folder","cantina"); tab=load("cbd_tab","learn");
  }
  items.forEach(i=>{if(!i.folder)i.folder="cantina"});
  if(!items.some(i=>i.folder==="classics")&&!(remote&&remote.classicsAdded)) items=items.concat(JSON.parse(JSON.stringify(CLASSICS)));
  const ver=remote?remote.dataVersion||1:load("cbd_ver",1);
  if(ver<DATA_VERSION) upgradeItems();
  if(!FOLDERS[folder]) folder="cantina";
  const DEF={cantina:["Cocktails","Happy hour","Shots"],cocina:["Clásicos","De la casa","Happy hour","Low & no"]};
  for(const k in FOLDERS) if(!Array.isArray(decksBy[k])||!decksBy[k].length) decksBy[k]=DEF[k]||[...FOLDERS[k].cats];
  if(!["learn","cards","quiz","bar","edit"].includes(tab)) tab="learn";
}
// Adds new drinks and fills in house specs without overwriting anything the user edited
function upgradeItems(){
  const byId=new Map(items.map(i=>[i.id,i]));
  for(const d of DEFAULT_ITEMS()){
    const u=byId.get(d.id);
    if(!u){items.push(d);continue}
    for(const f of ["spec","method","glass","rim","garnish"]) if(!u[f]&&d[f]) u[f]=d[f];
    if(d.qa&&!u.qa) u.qa=d.qa;
  }
}
Object.defineProperty(window,"decks",{get:()=>decksBy[folder],set:v=>{decksBy[folder]=v}});
const snapshot=()=>({items,stats,decksBy,folder,tab,classicsAdded:true,dataVersion:DATA_VERSION});
const persist=()=>{if(window.cloudSave) window.cloudSave(snapshot())};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const isQuizzable=i=>i.ingredients.length||(i.qa&&i.qa.length);
const pool=()=>items.filter(i=>i.folder===folder&&decks.includes(i.cat));
const st=id=>stats[id]||(stats[id]={hit:0,miss:0,streak:0});
const peek=id=>stats[id]||{hit:0,miss:0,streak:0};
function weight(i){const s=peek(i.id);let w=1+s.miss*1.6-s.hit*.5-s.streak*.4;if(!s.hit&&!s.miss)w+=1;return Math.max(.25,Math.min(6,w))}
function pickWeighted(arr,avoid){const c=arr.length>1?arr.filter(x=>x.id!==avoid):arr;let t=c.reduce((a,x)=>a+weight(x),0),r=Math.random()*t;for(const x of c){r-=weight(x);if(r<=0)return x}return c[c.length-1]}
const level=i=>Math.max(0,Math.min(3,peek(i.id).streak));
const isWeak=i=>{const s=peek(i.id);return (s.miss>0&&s.streak<2)||(s.hit+s.miss>0&&s.streak===0)};
function record(id,ok){const s=st(id);if(ok){s.hit++;s.streak++}else{s.miss++;s.streak=0}persist();renderMastery()}

  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- Announcements & toasts ---------- */
function announce(t){const l=$("#live");l.textContent="";setTimeout(()=>{l.textContent=t},40)}
function toast(t){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const d=document.createElement("div");d.className="toast";d.setAttribute("aria-hidden","true");d.textContent=t;document.body.appendChild(d);
  announce(t);setTimeout(()=>d.remove(),2200);
}

/* ---------- Dialog (focus trap, Escape, restore focus) ---------- */
let lastFocus=null;
const FOCUSABLE='button:not([disabled]),[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function openDialog(html,{focus}={}){
  lastFocus=document.activeElement;
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">${html}</div></div>`;
  document.body.classList.add("modal-open");
  document.querySelectorAll(".app,.tabbar,#gate").forEach(e=>e.setAttribute("inert",""));
  const dlg=$(".dialog");
  $("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")closeDialog()});
  dlg.addEventListener("keydown",e=>{
    if(e.key==="Escape"){e.preventDefault();closeDialog();return}
    if(e.key!=="Tab")return;
    const f=[...dlg.querySelectorAll(FOCUSABLE)];if(!f.length)return;
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}
  });
  (focus?dlg.querySelector(focus):dlg.querySelector(FOCUSABLE))?.focus();
  return dlg;
}
function closeDialog(){
  $("#layer").innerHTML="";document.body.classList.remove("modal-open");
  document.querySelectorAll("[inert]").forEach(e=>e.removeAttribute("inert"));
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function confirmDialog(title,body,label,yes){
  openDialog(`<h2 class="panel-title" id="dlg-title">${esc(title)}</h2>${body?`<p class="lede">${esc(body)}</p>`:""}
    <div class="btns"><button class="btn" id="c-no">Cancel</button><button class="btn btn-danger" id="c-yes">${esc(label)}</button></div>`,{focus:"#c-no"});
  $("#c-no").onclick=closeDialog;$("#c-yes").onclick=()=>{closeDialog();yes()};
}

/* ---------- Drink card ---------- */
const MIXED=["Cocktails","Happy hour","Shots","0%","Clásicos","De la casa","Low & no","Brunch","House classics","Off-menu"];
function drinkCard(i,{edit=false,level:showLevel=true}={}){
  const hid="d-"+i.id;
  const FACT=[["glass","Glass"],["method","Method"],["rim","Rim"],["garnish","Garnish"]].filter(([k])=>i[k]&&!(k==="rim"&&i[k]==="None"));
  const facts=FACT.length?`<dl class="facts">${FACT.map(([k,l])=>`<dt>${l}</dt><dd>${esc(i[k])}</dd>`).join("")}</dl>`:"";
  const spec=i.spec?`<div class="spec"><span class="spec-label">${i.folder==="classics"?"Spec":"House spec"}</span>${esc(i.spec)}</div>`:"";
  const addSpec=!i.spec&&edit&&i.folder!=="classics"&&MIXED.includes(i.cat)&&i.ingredients.length?`<button type="button" class="link" data-edit="${esc(i.id)}">+ Add house spec</button>`:"";
  const vid=i.video&&/^https:\/\//.test(i.video)?`<a class="link" href="${esc(i.video)}" target="_blank" rel="noopener">▶ Watch the build<span class="sr-only"> for ${esc(i.name)} on YouTube (opens in a new tab)</span></a>`:"";
  return `<article class="card" aria-labelledby="${hid}">
    <div class="drink-head">
      <div class="grow">
        <h3 class="card-title" id="${hid}">${esc(i.name)}</h3>
        ${i.spirit?`<p class="spirit">${esc(i.spirit)}</p>`:""}
      </div>
      ${i.price?`<span class="price">${esc(i.price)}</span>`:""}
      ${edit?`<button type="button" class="btn btn-icon" data-edit="${esc(i.id)}" aria-label="Edit ${esc(i.name)}">${ICON.edit}</button>`:""}
    </div>
    ${i.ingredients.length?`<ul class="ings" aria-label="Ingredients">${i.ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${i.note?`<p class="note">${esc(i.note)}</p>`:""}
    ${facts}${spec}
    ${(showLevel&&isQuizzable(i))||addSpec||vid?`<div class="card-foot">${showLevel&&isQuizzable(i)?meter(i):""}${vid}${addSpec}</div>`:""}
  </article>`;
}

/* ---------- QUIZ ---------- */
let qz=null;
const KIND=i=>i.folder==="classics"?"mixed":({Food:"food",Softs:"other",Beer:"other",Wine:"other",Cerveza:"other",Vino:"other",Micheladas:"miche","House info":"info"}[i.cat]||"mixed");
const ingStr=i=>i.ingredients.join(", ");
const words=i=>new Set(i.ingredients.flatMap(x=>norm(x).split(/[^a-z0-9%]+/)).filter(w=>w.length>2));
function similar(i,cands){
  // rank plausible distractors: same kind, shared ingredients, same category
  const w=words(i);
  return cands.filter(x=>x.id!==i.id&&KIND(x)===KIND(i))
    .map(x=>{let s=0;words(x).forEach(t=>{if(w.has(t))s+=2});if(x.cat===i.cat)s+=1;if(FAM_OF[x.id]&&FAM_OF[i.id]&&FAM_OF[x.id].fam===FAM_OF[i.id].fam)s+=3;return {x,s:s+Math.random()*1.5}})
    .sort((a,b)=>b.s-a.s).map(o=>o.x);
}
function makeOptions(correct,cands){const w=uniq(cands.filter(c=>c&&c!==correct)).slice(0,3);return w.length<3?null:shuffle([correct,...w])}
function genQuestion(i){
  const all=items.filter(x=>x.folder===i.folder&&x.ingredients.length);
  const near=similar(i,all);
  const gens=[];
  const nm=`<strong>${esc(i.name)}</strong>`;
  if(i.ingredients.length>=2){
    gens.push(()=>{const o=makeOptions(ingStr(i),near.filter(x=>ingStr(x)!==ingStr(i)).slice(0,6).map(ingStr).sort(()=>Math.random()-.5));return o&&{q:`What goes into the ${nm}?`,opts:o,a:ingStr(i)}});
    gens.push(()=>{const o=makeOptions(i.name,near.filter(x=>ingStr(x)!==ingStr(i)).slice(0,6).map(x=>x.name).sort(()=>Math.random()-.5));return o&&{q:"Which drink is this?",detail:ingStr(i),opts:o,a:i.name}});
  }
  if(i.ingredients.length&&i.price&&i.price.startsWith("£")) gens.push(()=>{const o=makeOptions(i.price,shuffle(uniq(items.filter(x=>x.folder===i.folder&&KIND(x)===KIND(i)).map(x=>x.price))).filter(p=>p&&p.startsWith("£")));return o&&{q:`How much is the ${nm}?`,opts:o,a:i.price}});
  if(i.spirit) gens.push(()=>{const o=makeOptions(i.spirit,shuffle(items.filter(x=>x.folder===i.folder&&x.spirit&&x.spirit!==i.spirit&&!x.spirit.includes(i.spirit)&&!i.spirit.includes(x.spirit)).map(x=>x.spirit)));return o&&{q:`What's the base spirit in the ${nm}?`,opts:o,a:i.spirit}});
  if(i.ingredients.length>=3) gens.push(()=>{
    const mine=i.ingredients.map(norm);
    const foreign=uniq(near.flatMap(x=>x.ingredients)).find(s=>!mine.some(m=>m.includes(norm(s))||norm(s).includes(m)));
    if(!foreign) return null;
    return {q:`Which of these is <em>not</em> in the ${nm}?`,opts:shuffle([foreign,...shuffle(i.ingredients).slice(0,3)]),a:foreign};
  });
  [["method","How is the %s made?"],["glass","What's the %s served in?"],["rim","What's the rim on the %s?"],["garnish","What's the garnish on the %s?"]].forEach(([f,t])=>{
    if(!i[f])return;
    gens.push(()=>{const o=makeOptions(i[f],shuffle(all.filter(x=>x[f]&&x[f]!==i[f]).map(x=>x[f])));return o&&{q:t.replace("%s",nm),opts:o,a:i[f]}});
  });
  if(FAM_OF[i.id]&&i.folder==="cantina"){
    const fams=FAMILIES.cantina.map(f=>f.name);
    gens.push(()=>{const o=makeOptions(FAM_OF[i.id].fam.name,shuffle(fams));return o&&{q:`Which family is the ${nm} in?`,opts:o,a:FAM_OF[i.id].fam.name}});
    gens.push(()=>{const d=FAM_OF[i.id].diff;const others=shuffle(Object.entries(FAM_OF).filter(([id,v])=>id!==i.id&&v.fam===FAM_OF[i.id].fam&&v.diff!==d).map(([id])=>items.find(x=>x.id===id)).filter(Boolean));
      if(others.length<2)return null;const o=makeOptions(i.name,others.map(x=>x.name).concat(similar(i,all).map(x=>x.name)));return o&&{q:"Which drink is this?",detail:d.replace(new RegExp(i.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"___"),opts:o,a:i.name}});
  }
  // measures from the house spec, e.g. "25ml lime juice"
  const lines=(i.spec||"").split("\n").map(l=>l.match(/^(\d+(?:\.\d+)?)ml\s+(.+)$/i)).filter(Boolean).filter(m=>!/ OR /i.test(m[2]));
  if(lines.length&&i.folder!=="classics") gens.push(()=>{
    const m=lines[Math.random()*lines.length|0],v=+m[1],what=m[2].replace(/\s*\(.*\)$/,"");
    const pool=[5,7,10,15,20,25,30,35,40,50,60,70].filter(x=>x!==v).sort((p,q)=>Math.abs(p-v)-Math.abs(q-v)).slice(0,4);
    return {q:`How much ${esc(what)} goes in the ${nm}?`,opts:shuffle([v+"ml",...shuffle(pool).slice(0,3).map(x=>x+"ml")]),a:v+"ml"};
  });
  (i.qa||[]).forEach(x=>gens.push(()=>({q:esc(x.q),opts:shuffle([x.a,...x.w.slice(0,3)]),a:x.a})));
  for(const g of shuffle(gens)){const r=g();if(r)return {...r,item:i}}
  return null;
}
function startQuiz({n=10,only=null}={}){
  let p=pool().filter(isQuizzable);
  if(only) p=p.filter(i=>only.includes(i.id));
  if(!p.length){qz=null;$("#main").innerHTML=`<p class="empty">Pick a category with drinks first.</p>`;return}
  const qs=[];let last=null,guard=0;
  while(qs.length<n&&guard++<300){const it=pickWeighted(p,last);const q=genQuestion(it);if(q&&!qs.some(x=>x.q===q.q&&x.a===q.a)){qs.push(q);last=it.id}}
  qz={qs,idx:0,score:0,answered:false,picked:null,missed:[]};
  renderQuiz();
}
function answer(k){
  if(!qz||qz.answered)return;
  const q=qz.qs[qz.idx];qz.picked=k;qz.answered=true;
  const ok=q.opts[k]===q.a;if(ok)qz.score++;else qz.missed.push(q.item.id);
  record(q.item.id,ok);
  renderQuiz(`.option[data-k="${k}"]`);
  announce(ok?"Correct.":`Not quite. The answer is ${q.a}.`);
}
function nextQ(){if(!qz||!qz.answered)return;qz.idx++;qz.answered=false;qz.picked=null;renderQuiz("#q-text");window.scrollTo(0,0)}
function renderQuiz(focusSel){
  if(!qz){startQuiz();return}
  if(qz.idx>=qz.qs.length){
    const n=qz.qs.length,pct=Math.round(qz.score/n*100),missed=uniq(qz.missed);
    const weak=pool().filter(isQuizzable).filter(isWeak).map(i=>i.id);
    $("#main").innerHTML=`<section class="card" aria-labelledby="q-done" style="text-align:center">
      <h2 class="panel-title" id="q-done" tabindex="-1">Round done</h2>
      <p class="score" aria-label="${qz.score} out of ${n}">${qz.score}/${n}</p>
      <p class="hint">${pct===100?"Flawless. Behind the bar you go.":pct>=80?"Solid. A couple to tighten up.":pct>=50?"Getting there. Run another round.":"Spend a few minutes in Learn, then go again."}</p>
      <div class="stack" style="margin-top:var(--s-4)">
        <button type="button" class="btn btn-primary btn-block" id="again">Another round</button>
        ${missed.length?`<button type="button" class="btn btn-block" id="misses">Drill the ${missed.length} I missed</button>`:""}
        ${weak.length>missed.length?`<button type="button" class="btn btn-block" id="weak">Drill all weak spots (${weak.length})</button>`:""}
      </div></section>
      ${missed.length?`<h2 class="section-title">Review</h2>`+missed.map(id=>drinkCard(items.find(x=>x.id===id))).join(""):""}`;
    $("#again").onclick=()=>{startQuiz();$("#q-text")?.focus()};
    if($("#misses")) $("#misses").onclick=()=>{startQuiz({n:Math.max(5,missed.length*2),only:missed});$("#q-text")?.focus()};
    if($("#weak")) $("#weak").onclick=()=>{startQuiz({n:10,only:weak});$("#q-text")?.focus()};
    $("#q-done").focus();
    return;
  }
  const q=qz.qs[qz.idx],n=qz.qs.length,L="ABCD";
  const opt=(o,k)=>{
    let cls="",sr="",icon=L[k];
    if(qz.answered){
      if(o===q.a){cls="is-correct";sr=" (correct answer)";icon=ICON.check}
      else if(k===qz.picked){cls="is-wrong";sr=" (your answer)";icon=ICON.cross}
      else cls="is-dim";
    }
    return `<button type="button" class="option ${cls}" data-k="${k}" ${qz.answered?'aria-disabled="true"':""}><span class="key" aria-hidden="true">${icon}</span><span>${esc(o)}<span class="sr-only">${sr}</span></span></button>`;
  };
  const ok=qz.answered&&q.opts[qz.picked]===q.a;
  $("#main").innerHTML=`<section class="card" aria-labelledby="q-text">
      <div class="q-meta"><span>Question ${qz.idx+1} of ${n}</span><span>${qz.score} correct</span></div>
      <div class="bar quiz" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${qz.idx}"><span style="width:${qz.idx/n*100}%"></span></div>
      <h2 class="question" id="q-text" tabindex="-1">${q.q}${q.detail?`<span class="question-detail" style="display:block">${esc(q.detail)}</span>`:""}</h2>
      <div class="options" role="group" aria-labelledby="q-text">${q.opts.map(opt).join("")}</div>
      ${qz.answered?`<p class="verdict ${ok?"ok":"bad"}" aria-hidden="true">${ok?ICON.check+" ¡Eso! Correct.":ICON.cross+" Not quite."}</p>`:`<p class="lede" style="margin-top:var(--s-3)">Tip: keys 1–4 or A–D answer, Enter goes to the next question.</p>`}
    </section>
    ${qz.answered?`<h2 class="section-title">The spec</h2>${drinkCard(q.item)}
      <div class="actionbar"><button type="button" class="btn btn-dark btn-block" id="nextq">${qz.idx+1<n?"Next question":"See my score"} →</button></div>`:""}`;
  $("#main").querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if($("#nextq")) $("#nextq").onclick=nextQ;
  if(focusSel) $(focusSel)?.focus();
}
document.addEventListener("keydown",e=>{
  if(tab!=="quiz"||!qz||$("#layer").children.length||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const k="1234".indexOf(e.key)>-1?"1234".indexOf(e.key):"abcd".indexOf(e.key.toLowerCase());
  if(!qz.answered&&k>-1&&e.key.length===1&&qz.qs[qz.idx]&&k<qz.qs[qz.idx].opts.length){e.preventDefault();answer(k)}
  else if(qz.answered&&(e.key==="Enter"||e.key==="ArrowRight")&&!(e.target.closest&&e.target.closest("a"))){e.preventDefault();nextQ()}
});

/* ---------- BAR MODE ---------- */
let bar=null;
const VLABEL={classic:"Classic",spicy:"Spicy",tequila:"Tequila",mezcal:"Mezcal",vodka:"Vodka","Clásica":"Clásica"};
const barPool=()=>pool().filter(i=>BUILD[i.id]);
function newTicket(avoid){
  const p=barPool();if(!p.length){bar=null;return}
  const item=pickWeighted(p,avoid),vs=Object.keys(BUILD[item.id]),variant=vs[Math.random()*vs.length|0];
  bar={item,variant,spec:BUILD[item.id][variant],sel:{glass:null,rim:null,method:null,garnish:null,ings:{}},hint:false,result:null,railQ:"",practice:false};
}
function pickGroup(key,label,opts,cur){
  return `<fieldset class="bar-step"><legend class="step-title">${label}</legend><div class="picks" role="group">${opts.map(o=>`<button type="button" class="pick" data-pick="${key}" data-v="${esc(o)}" aria-pressed="${cur===o}">${esc(o)}</button>`).join("")}</div></fieldset>`;
}
function amountControl(k){
  const u=ING[k].unit,v=bar.sel.ings[k];
  if(FIXED[u]) return `<span class="amt-fixed">${FIXED[u]}</span>`;
  return `<select class="input amt" data-amt="${k}" aria-label="Amount of ${esc(ING[k].label)}"><option value="">Amount…</option>${AMOUNTS[u].map(a=>`<option value="${a}" ${String(v)===String(a)?"selected":""}>${esc(fmtAmt(k,a))}</option>`).join("")}</select>`;
}
function renderRail(){
  const q=norm(bar.railQ.trim());let h="";
  for(const g in RAIL){
    const keys=Object.keys(RAIL[g]).filter(k=>!q||norm(ING[k].label).includes(q));if(!keys.length)continue;
    h+=`<h4 class="rail-h">${esc(g)}</h4><div class="picks">${keys.map(k=>`<button type="button" class="pick" data-ing="${k}" aria-pressed="${k in bar.sel.ings}">${esc(ING[k].label)}</button>`).join("")}</div>`;
  }
  $("#rail").innerHTML=h||`<p class="lede">Nothing on the rail matches.</p>`;
  $("#rail").querySelectorAll("[data-ing]").forEach(b=>b.onclick=()=>toggleIng(b.dataset.ing));
}
function renderBuildList(){
  const ks=Object.keys(bar.sel.ings);
  $("#buildlist").innerHTML=ks.length?ks.map(k=>`<li class="bl-row"><span class="grow">${esc(ING[k].label)}</span>${amountControl(k)}<button type="button" class="btn btn-icon" data-rm="${k}" aria-label="Remove ${esc(ING[k].label)}">${ICON.cross}</button></li>`).join(""):`<li class="lede">Nothing in the tin yet. Pick from the rail below.</li>`;
  $("#buildlist").querySelectorAll("[data-amt]").forEach(s=>s.onchange=()=>{bar.sel.ings[s.dataset.amt]=s.value?+s.value:null});
  $("#buildlist").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{toggleIng(b.dataset.rm);$("#rail-q")?.focus()});
}
function toggleIng(k){
  if(k in bar.sel.ings) delete bar.sel.ings[k]; else bar.sel.ings[k]=FIXED[ING[k].unit]?1:null;
  renderBuildList();
  const b=$(`#rail [data-ing="${k}"]`);if(b)b.setAttribute("aria-pressed",String(k in bar.sel.ings));
  announce(`${ING[k].label} ${k in bar.sel.ings?"added":"removed"}`);
}
function checkBuild(spec,sel){
  const rows=[],one=(label,you,want,ok)=>rows.push({label,you:you||"Nothing picked",want,ok});
  one("Glass",sel.glass,spec.glass.join(" or "),spec.glass.includes(sel.glass));
  one("Rim",sel.rim,spec.rim,sel.rim===spec.rim);
  for(const k in spec.ings){
    const want=fmtAmt(k,spec.ings[k]);
    if(!(k in sel.ings)) rows.push({label:ING[k].label,you:"Missing",want,ok:false,kind:"missing"});
    else{const v=sel.ings[k],ok=FIXED[ING[k].unit]?true:v===spec.ings[k];rows.push({label:ING[k].label,you:v==null?"No amount":fmtAmt(k,v),want,ok,kind:ok?"":"amount"})}
  }
  for(const k in sel.ings) if(!(k in spec.ings)) rows.push({label:ING[k].label,you:"Added",want:"Not in this drink",ok:false,kind:"extra"});
  one("Method",sel.method,spec.method,sel.method===spec.method);
  one("Garnish",sel.garnish,spec.garnish,sel.garnish===spec.garnish);
  return rows;
}

    $("#r-h").focus();

    <fieldset class="bar-step"><legend class="step-title">3 · Ingredients</legend>

  renderBuildList();renderRail();
  $("#rail-q").oninput=e=>{bar.railQ=e.target.value;renderRail()};
  $("#main").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.pick,v=b.dataset.v;s[k]=s[k]===v?null:v;
    b.closest(".picks").querySelectorAll(".pick").forEach(x=>x.setAttribute("aria-pressed",String(s[k]===x.dataset.v)));
  });
  if($("#b-hint")) $("#b-hint").onclick=()=>{bar.hint=true;renderBar("#t-name")};
  if($("#b-next")) $("#b-next").onclick=()=>{newTicket(item.id);renderBar("#t-name");window.scrollTo(0,0)};
  if($("#b-show")) $("#b-show").onclick=()=>{bar.result=checkBuild(spec,s);bar.practice=true;renderBar()};
  if($("#b-submit")) $("#b-submit").onclick=()=>{
    const miss=[["glass","a glass"],["rim","a rim (or No rim)"],["method","a method"],["garnish","a garnish (or None)"]].filter(([k])=>!s[k]).map(x=>x[1]);
    if(!Object.keys(s.ings).length) miss.splice(2,0,"some ingredients");
    const noAmt=Object.keys(s.ings).filter(k=>s.ings[k]==null);
    if(miss.length||noAmt.length){
      $("#b-err").textContent=miss.length?`Still to pick: ${miss.join(", ")}.`:`Set an amount for ${noAmt.map(k=>ING[k].label).join(", ")}.`;
      (noAmt.length&&!miss.length?$(`[data-amt="${noAmt[0]}"]`):$("#b-err"))?.focus?.();return;
    }
    bar.result=checkBuild(spec,s);
    const ok=bar.result.every(r=>r.ok);
    if(!bar.practice){record(item.id,ok);st(item.id).bar=ok;persist()}
    renderBar();window.scrollTo(0,0);
    announce(ok?"Nailed it.":`${bar.result.filter(r=>r.ok).length} of ${bar.result.length} right.`);
  };
  if(focusSel) $(focusSel)?.focus();
}

</script>
<script type="module">
/* ---------- Firebase auth + sync ---------- */
const V = "13.4.0";
const gate = document.getElementById("gate");
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
gate.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';

let firebaseConfig, cfgProblem = null;
try {
  const mod = await import("./firebase-config.js?v=" + Date.now());
  firebaseConfig = mod.firebaseConfig || mod.default;
  if (!firebaseConfig) cfgProblem = "The file loaded, but it doesn't export the config. The line must start with <code>export const firebaseConfig = {</code>, not just <code>const firebaseConfig = {</code>.";
  else if (!firebaseConfig.apiKey || /PASTE/.test(JSON.stringify(firebaseConfig))) cfgProblem = "The file still has <code>PASTE_…</code> placeholders. Replace every value with the one from the Firebase console, save, then run <code>firebase deploy</code> again.";
} catch (e) {
  const m = String(e && e.message || e);
  cfgProblem = /resolve|specifier/i.test(m)
    ? "The file contains <code>import … from \"firebase/app\"</code> or similar lines. Delete every line except the <code>export const firebaseConfig = { … };</code> block."
    : /Failed to fetch|404|dynamically imported/i.test(m)
      ? "The app can't find <b>firebase-config.js</b>. It must sit inside the <b>public</b> folder next to index.html."
      : "The file has a typing error, so the browser can't read it. Check for a missing comma, quote or bracket. Browser error: <code>" + esc(m) + "</code>";
}
if (cfgProblem) {
  gate.innerHTML = `<main>${'<h1 class="gate-h">BAR<br>DRILL</h1>'}
    <section class="card" aria-labelledby="cfg-t"><h2 class="panel-title" id="cfg-t">Firebase isn't connected yet</h2>
    <p style="margin-top:var(--s-2)">${cfgProblem}</p>
    <p class="lede">The file is <strong>public/firebase-config.js</strong>. The README has the full steps.</p></section></main>`;
  throw new Error("Firebase config problem");
}

const [{ initializeApp }, A, F] = await Promise.all([
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
]);
const app = initializeApp(firebaseConfig);
const auth = A.getAuth(app);
await A.setPersistence(auth, A.browserLocalPersistence).catch(()=>{});
let db;
try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
catch(e) { db = F.getFirestore(app); }

/* ---------- Error messages ---------- */
const ERR = {
  "auth/invalid-credential":"That email and password don't match.",
  "auth/wrong-password":"That email and password don't match.",
  "auth/user-not-found":"That email and password don't match.",
  "auth/invalid-email":"That doesn't look like a valid email.",
  "auth/email-already-in-use":"There's already an account with that email. Try signing in, or reset your password.",
  "auth/weak-password":"Use at least 8 characters.",
  "auth/missing-password":"Enter your password.",
  "auth/too-many-requests":"Too many attempts. Wait a few minutes, or reset your password.",
  "auth/network-request-failed":"No connection. Check your signal and try again.",
  "auth/popup-closed-by-user":"Google sign-in was closed before it finished.",
  "auth/popup-blocked":"Your browser blocked the Google pop-up. Allow pop-ups and try again.",
  "auth/requires-recent-login":"For security, confirm it's you first.",
  "auth/user-disabled":"This account has been disabled.",
  "auth/account-exists-with-different-credential":"This email already uses a different sign-in method. Try email and password."
};
const errText = e => ERR[e && e.code] || "Something went wrong. Please try again.";

/* ---------- Sign-in screens ---------- */
let mode = "signin", flash = null;
const brandHead = sub => `<h1 class="gate-h">BAR<br>DRILL</h1><p class="eyebrow" style="margin:var(--s-2) 0 var(--s-2)">${sub||"Corrochio's bar trainer"}</p>`;
function pwField(id,label,ac){
  return `<div class="field"><label class="field-label" for="${id}">${label}</label><div class="pw">
    <input class="input" id="${id}" type="password" autocomplete="${ac}" required ${flash&&flash.t==="error"&&flash.f&&flash.f.includes(id)?'aria-invalid="true" aria-describedby="a-msg"':""}>
    <button type="button" data-show="${id}" aria-pressed="false" aria-label="Show password">Show</button></div></div>`;
}
function gateView(){
  const title = {signin:"Sign in", signup:"Create your account", reset:"Reset your password"}[mode];
  const bad = id => flash&&flash.t==="error"&&flash.f&&flash.f.includes(id) ? 'aria-invalid="true" aria-describedby="a-msg"' : "";
  gate.innerHTML = `<main id="gate-main">${brandHead()}
  <section class="card" aria-labelledby="a-title">
    <h2 class="panel-title" id="a-title">${title}</h2>
    ${mode==="reset"?`<p class="lede">Enter your email and we'll send you a link to choose a new password.</p>`:""}
    <form id="af" novalidate>
      ${mode==="signup"?`<div class="field"><label class="field-label" for="a-name">Name</label><input class="input" id="a-name" autocomplete="name"></div>`:""}
      <div class="field"><label class="field-label" for="a-email">Email</label><input class="input" id="a-email" type="email" autocomplete="email" inputmode="email" required ${bad("a-email")}></div>
      ${mode!=="reset"?pwField("a-pass","Password",mode==="signup"?"new-password":"current-password"):""}
      ${mode==="signup"?`<span class="field-hint">At least 8 characters.</span>`+pwField("a-pass2","Confirm password","new-password"):""}
      ${flash?`<div id="a-msg" class="msg msg-${flash.t}" role="${flash.t==="error"?"alert":"status"}">${esc(flash.m)}</div>`:""}
      <button class="btn btn-dark btn-block" style="margin-top:var(--s-4)" id="a-go">${mode==="reset"?"Send reset link":mode==="signup"?"Create account":"Sign in"}</button>
    </form>
    ${mode==="signin"?`<div style="text-align:right;margin-top:var(--s-2)"><button type="button" class="link" data-m="reset">Forgot password?</button></div>`:""}
    ${mode!=="reset"?`<div class="or">or</div><button type="button" class="btn btn-block" id="a-google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.3 5.6c4.3-3.9 7-9.8 7-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.6c-2.1 1.4-4.9 2.3-8.6 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Continue with Google</button>`:""}
  </section>
  <p style="text-align:center">
    ${mode==="signin"?`New here? <button type="button" class="link" data-m="signup">Create an account</button>`:`<button type="button" class="link" data-m="signin">Back to sign in</button>`}
  </p></main>`;
  gate.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
    const em=document.getElementById("a-email")?.value; mode=b.dataset.m; flash=null; gateView();
    const el=document.getElementById("a-email"); if(em) el.value=em; document.getElementById("a-title").setAttribute("tabindex","-1"); document.getElementById("a-title").focus();
  });
  gate.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{
    const i=document.getElementById(b.dataset.show), on=i.type==="password";
    i.type=on?"text":"password"; b.textContent=on?"Hide":"Show"; b.setAttribute("aria-pressed",String(on)); b.setAttribute("aria-label",on?"Hide password":"Show password");
  });
  document.getElementById("af").onsubmit = submit;
  const g=document.getElementById("a-google"); if(g) g.onclick=google;
}
function busy(on){const b=document.getElementById("a-go"); if(b){b.disabled=on;b.setAttribute("aria-busy",String(on))}}
// t: "error" | "success" | "info"; f: ids of the fields the message is about
function show(t,m,f){
  flash={t,m,f}; const em=document.getElementById("a-email")?.value; gateView();
  if(em) document.getElementById("a-email").value=em;
  if(f&&f.length) document.getElementById(f[0])?.focus();
}
async function submit(e){
  e.preventDefault();
  const email=document.getElementById("a-email").value.trim();
  const pass=document.getElementById("a-pass")?.value||"";
  if(!email) return show("error","Enter your email.",["a-email"]);
  busy(true);
  try{
    if(mode==="reset"){
      try{ await A.sendPasswordResetEmail(auth,email); }
      catch(err){ if(!["auth/user-not-found"].includes(err.code)) throw err; }
      mode="signin"; return show("success","If there's an account for that email, a reset link is on its way. Check your spam folder too.");
    }
    if(mode==="signup"){
      const name=document.getElementById("a-name").value.trim();
      if(pass.length<8) return show("error","Use at least 8 characters.",["a-pass"]);
      if(pass!==document.getElementById("a-pass2").value) return show("error","The passwords don't match.",["a-pass2"]);
      const cred=await A.createUserWithEmailAndPassword(auth,email,pass);
      if(name) await A.updateProfile(cred.user,{displayName:name}).catch(()=>{});
      A.sendEmailVerification(cred.user).catch(()=>{});
      return;
    }
    await A.signInWithEmailAndPassword(auth,email,pass);
  }catch(err){ show("error",errText(err),/email/.test(err.code||"")?["a-email"]:/password|credential/.test(err.code||"")?["a-email","a-pass"]:[]); }
  finally{ busy(false); }
}
async function google(){
  try{ await A.signInWithPopup(auth,new A.GoogleAuthProvider()); }
  catch(err){
    if(err.code==="auth/popup-blocked"||err.code==="auth/operation-not-supported-in-this-environment"){
      try{ await A.signInWithRedirect(auth,new A.GoogleAuthProvider()); return; }catch(e2){ err=e2; }
    }
    if(err.code!=="auth/cancelled-popup-request") show("error",errText(err));
  }
}
A.getRedirectResult(auth).catch(err=>show("error",errText(err)));

/* ---------- Cloud sync ---------- */
let user=null, saveTimer=null, pending=null, syncState="ok";
const userDoc = () => F.doc(db,"users",user.uid);
function setSync(s){ syncState=s; const el=document.getElementById("sync"); if(el) el.outerHTML=syncHTML(); }
function syncHTML(){
  const t={ok:"Synced",saving:"Saving…",off:"Offline: changes will sync when you reconnect"}[syncState];
  return `<span id="sync" class="sync ${syncState==="saving"?"saving":syncState==="off"?"off":""}"><i></i>${t}</span>`;
}
window.cloudSave = data => {
  if(!user) return;
  pending = data; setSync("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
};
async function flush(){
  if(!user||!pending) return;
  const data = JSON.parse(JSON.stringify(pending)); pending=null;
  try{
    await F.setDoc(userDoc(), {...data, updatedAt:F.serverTimestamp()});
    setSync(navigator.onLine===false?"off":"ok");
  }catch(err){ console.error(err); setSync("off"); }
}
addEventListener("online",()=>setSync("ok"));
addEventListener("offline",()=>setSync("off"));
addEventListener("pagehide",()=>{ if(pending) flush(); });

/* ---------- Account panel (inside Manage) ---------- */
window.renderAccount = el => {
  if(!user||!el) return;
  const isPw = user.providerData.some(p=>p.providerId==="password");
  const isG = user.providerData.some(p=>p.providerId==="google.com");
  el.setAttribute("aria-labelledby","h-acct"); el.removeAttribute("aria-label");
  el.innerHTML = `<div class="row"><h2 class="panel-title" id="h-acct">Account</h2>${syncHTML()}</div>
    <p style="margin-top:var(--s-2)">${user.displayName?`<strong>${esc(user.displayName)}</strong><br>`:""}<span class="muted">${esc(user.email||"")}</span>${isG?'<span class="tag">Google</span>':""}</p>
    ${isPw&&!user.emailVerified?`<div class="msg msg-info">Verify your email so you can always get back into your account. <button type="button" class="link" id="ac-ver">Resend link</button></div>`:""}
    <div class="btns">${isPw?`<button type="button" class="btn btn-sm" id="ac-pw">Reset password</button>`:""}<button type="button" class="btn btn-sm btn-dark" id="ac-out">Sign out</button></div>
    <div style="margin-top:var(--s-2)"><button type="button" class="link danger" id="ac-del">Delete my account</button></div>`;
  const m = window;
  el.querySelector("#ac-out").onclick = async()=>{ await flush(); await A.signOut(auth); };
  const ver=el.querySelector("#ac-ver"); if(ver) ver.onclick=async()=>{try{await A.sendEmailVerification(user);m.toast("Verification email sent")}catch(e){m.toast(errText(e))}};
  const pw=el.querySelector("#ac-pw"); if(pw) pw.onclick=async()=>{try{await A.sendPasswordResetEmail(auth,user.email);m.toast("Password link sent to your email")}catch(e){m.toast(errText(e))}};
  el.querySelector("#ac-del").onclick = ()=>deleteFlow(isPw);
};
function deleteFlow(isPw){
  const m=window;
  m.openDialog(`<h2 class="panel-title" id="dlg-title">Delete your account?</h2>
    <p class="lede">This permanently removes your account, your progress and any drinks you've edited. It can't be undone.</p>
    ${isPw?`<div class="field"><label class="field-label" for="d-pass">Confirm with your password</label><input class="input" id="d-pass" type="password" autocomplete="current-password" aria-describedby="d-msg"></div>`:`<p class="lede">You'll be asked to confirm with Google.</p>`}
    <div id="d-msg"></div>
    <div class="btns"><button type="button" class="btn" id="d-no">Cancel</button><button type="button" class="btn btn-danger" id="d-yes">Delete forever</button></div>`,{focus:isPw?"#d-pass":"#d-no"});
  document.getElementById("d-no").onclick=m.closeModal;
  document.getElementById("d-yes").onclick=async()=>{
    const msg=document.getElementById("d-msg");
    try{
      if(isPw) await A.reauthenticateWithCredential(user, A.EmailAuthProvider.credential(user.email, document.getElementById("d-pass").value));
      else await A.reauthenticateWithPopup(user, new A.GoogleAuthProvider());
      clearTimeout(saveTimer); pending=null;
      await F.deleteDoc(userDoc());
      await A.deleteUser(user);
      m.closeModal();
    }catch(e){ msg.innerHTML=`<div class="msg msg-error" role="alert">${esc(errText(e))}</div>`; if(isPw){const p=document.getElementById("d-pass");p.setAttribute("aria-invalid","true");p.focus()} }
  };
}
/* ---------- Auth state ---------- */
A.onAuthStateChanged(auth, async u => {
  user = u;
  if(!u){
    document.body.classList.add("locked"); mode="signin"; gateView(); return;
  }
  gate.innerHTML='<div class="spinner" role="status" aria-label="Loading your progress"></div>';
  let remote=null;
  try{ const snap=await F.getDoc(userDoc()); if(snap.exists()) remote=snap.data(); }
  catch(err){
    console.error(err);
    // Never start with blank data offline: it could overwrite your saved progress
    gate.innerHTML=`<main>${brandHead()}<section class="card" aria-labelledby="off-t"><h2 class="panel-title" id="off-t">Can't load your progress</h2>
      <p class="lede">You seem to be offline. Connect once on this device and your data will be available offline after that.</p>
      <div class="btns"><button type="button" class="btn btn-sm" id="g-out">Sign out</button><button type="button" class="btn btn-sm btn-dark" id="g-retry">Try again</button></div></section></main>`;
    document.getElementById("g-retry").onclick=()=>location.reload();
    document.getElementById("g-out").onclick=()=>A.signOut(auth);
    return;
  }
  document.body.classList.remove("locked");
  window.bootApp(remote);
});
</script>

</body>
